apiVersion: v1
kind: ReplicationController
metadata:
  name: myapp
spec:
  replicas: 3
  selector:
    app: myapplebel
  template:
    metadata:
      name: myapp
      labels:
        app: myapplebel
    spec:
      containers:
      - name: myapp
        image: nginx
        ports:
        - containerPort: 80
