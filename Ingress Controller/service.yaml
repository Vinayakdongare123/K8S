apiVersion: v1
kind: Service
metadata:
  name: mobile-app-service
  labels: mobile-app-service
spec:
  type: ClusterIP
  selector:
    app: mobile-app      
  ports:
    - name: nginx
      protocol: TCP
      port: 80         
      targetPort: 8080
              
