apiVersion: v1
kind: Service
metadata:
  name: web-app-service
  labels: 
    app: web-app-service
spec:
  type: ClusterIP
  selector:
    app: web-app       
  ports:
  - name: http 
    protocol: TCP
    port: 80         
    targetPort: 80
---      
apiVersion: v1
kind: Service
metadata:
  name: mobile-app-service
  labels: 
    app: mobile-app-service
spec:
  type: ClusterIP
  selector:
    app: mobile-app      
  ports:
  - name: nginx
    protocol: TCP
    port: 80         
    targetPort: 80
              
