apiVersion: v1
kind: Service
metadata:
  name: web-app-service
  labels: web-app-service
spec:
  type: ClusterIP
  selector:
    app: web-app       
  ports:
    - name: http 
      protocol: TCP
      port: 80         
      targetPort: 8080
