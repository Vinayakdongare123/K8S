apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobile-app-deployment
spec:
  selector:
    matchLabels:
      app: mobile-app
  template:
    metadata:
      labels:
        app: mobile-app
    spec:
      containers:
      - name: mobile-container
        image: nginx:1.25
        ports:
        - containerPort: 80
   
            
