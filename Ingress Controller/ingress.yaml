apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx 
  rules:
  - host: web-app.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-app-service
            port: 
              number: 80
  - host: mobile-app.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mobile-app-servic
            port: 
            number: 80
