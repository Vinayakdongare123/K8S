apiVersion: v1
kind: Pod
metadata:
  name: storage-pod
spec:
  volumes:
    - name: storage-volume
      persistentVolumeClaim:
        claimName: example-pvc
  containers:
    - name: nginx-container
      image: nginx:latest
      volumeMounts:
        - name: storage-volume
          mountPath: "/usr/share/nginx/html"
