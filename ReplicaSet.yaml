apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: myreplicaset
  labels:
    app: myapp2
    Department: Devops
spec:
  replicas: 3
  selector:
    matchLabels:
      myapp: Devops
  template:
    metadata:
      labels:
        myapp: Devops
    spec:
      containers:
        - name: myapp
          image: nginx
          ports:
            - containetport: 80
          command: ["/bin/sh", "-c"]
          args: 
            - 
              echo '<h1>Hello This is Replica Set</h1>' > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'
            
